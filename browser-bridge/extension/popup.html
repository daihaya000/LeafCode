<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Browser Bridge</title></head>
<body><main><h1>Browser Bridge</h1><p id="status" role="status">Checking connection…</p><label>Broker URL<input id="broker-url" value="ws://127.0.0.1:18766/extension" inputmode="url"></label><label>Pairing code<input id="pairing-code" autocomplete="one-time-code"></label><button id="pair" class="primary">Pair extension</button><button id="share" class="secondary">Share active tab</button><label class="auto-share"><input type="checkbox" id="auto-share"> Auto-share every active tab</label><p class="warning">Grants broad site access once; every eligible tab you view afterward is shared automatically without further confirmation.</p><ul id="tabs"></ul><button id="revoke" class="danger">Forget this connection</button></main><script type="module" src="popup.mjs"></script></body></html>
