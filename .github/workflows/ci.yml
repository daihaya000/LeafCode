name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint / typecheck / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # NOTE: `next build` (web) は CI では実行しない。
  # 理由: 本番ビルドはローカル稼働中の WebUI と競合するため、エージェント/CI からの
  # 自動実行は禁止している（AGENTS.md / scripts/build-web.mjs 参照）。
  # ビルド検証はユーザーの明示指示時のみ。E2E（playwright）は webServer 起動が前提のため
  # CI 化スコープは IMPROVEMENT.md 8-4 / REFACTORING_PLAN Phase 7 で確定する。
