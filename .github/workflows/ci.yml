name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint / typecheck / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # E2E の CI 化スコープ（IMPROVEMENT 8-4）: 全 59 テストは実行時間が長いため、
  # smoke.spec.ts のみ CI で実行する。webServer（playwright.config.ts）が
  # `next build` を NEXT_DIST_DIR 分離で実行するため、ローカル稼働中の WebUI
  # には影響しない。頻度: push / PR ごと。
  e2e-smoke:
    name: e2e (smoke only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: E2E smoke
        run: npm run e2e:smoke
