name: encoding-check

on:
  push:
  pull_request:

jobs:
  bat-encoding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Encoding / batch safety tests
        run: npm run test:encoding
      - name: Install host dependencies
        run: npm ci --prefix host
      - name: Host tests (includes scripts/start-webui.bat code-page matrix)
        run: npm --prefix host test
